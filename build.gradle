// The developer has accepted the EULA for these disposable local test directories.
tasks.matching { it.name in ['runServer', 'runGameTestServer'] }.configureEach {
    doFirst {
        def runDirectory = layout.buildDirectory.dir("runs/${name.substring(3).uncapitalize()}").get().asFile
        runDirectory.mkdirs()
        new File(runDirectory, 'eula.txt').text = 'eula=true\n'
    }
}

tasks.named('jar', Jar) {
    from 'LICENSE.md'
    finalizedBy 'reobfJar'
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}
