plugins {
    id 'net.minecraftforge.gradle' version '6.0.54'
}

group = 'nc'
version = "${minecraft_version}-${mod_version}"
base.archivesName = 'nuclearcraft'

java.toolchain.languageVersion = JavaLanguageVersion.of(17)

sourceSets {
    // Keep the original sources available as a behavioral reference during the port.
    main {
        java.setSrcDirs(['src/forge/java'])
        resources.setSrcDirs(['src/forge/resources'])
    }
    gameTest {
        compileClasspath += main.output
        runtimeClasspath += main.output
    }
}

configurations {
    gameTestImplementation.extendsFrom implementation
}

minecraft {
    mappings channel: 'official', version: minecraft_version

    runs {
        configureEach {
            workingDirectory layout.buildDirectory.dir("runs/${name}").get().asFile
            mods {
                nuclearcraft {
                    source sourceSets.main
                }
            }
        }

        client {}

        server {
            args '--nogui'
            property 'java.awt.headless', 'true'
        }

        gameTestServer {
            property 'forge.enabledGameTestNamespaces', 'nuclearcraft'
            property 'java.awt.headless', 'true'
            mods {
                nuclearcraft {
                    source sourceSets.gameTest
                }
            }
        }
    }
}

repositories {
    maven {
        url = 'https://modmaven.dev'
        content { includeGroup 'mezz.jei' }
    }
}

dependencies {
    minecraft "net.minecraftforge:forge:${minecraft_version}-${forge_version}"
    compileOnly fg.deobf("mezz.jei:jei-${minecraft_version}-common-api:${jei_version}")
    compileOnly fg.deobf("mezz.jei:jei-${minecraft_version}-forge-api:${jei_version}")
}

tasks.named('processResources', ProcessResources) {
    inputs.property 'mod_version', mod_version
    filesMatching('META-INF/mods.toml') {
        expand mod_version: mod_version
    }
    from('src/main/resources') {
        include 'logo.png'
        include 'assets/nuclearcraft/textures/blocks/processor_*.png'
        include 'assets/nuclearcraft/textures/blocks/melter_front_*.png'
        include 'assets/nuclearcraft/textures/blocks/manufactory_front_*.png'
        include 'assets/nuclearcraft/textures/blocks/alloy_furnace_front_*.png'
        include 'assets/nuclearcraft/textures/blocks/separator_front_*.png'
        include 'assets/nuclearcraft/textures/blocks/infuser_front_*.png'
        include 'assets/nuclearcraft/textures/blocks/fluids/molten_*.png*'
        include 'assets/nuclearcraft/textures/blocks/fluids/steam.png*'
        include 'assets/nuclearcraft/textures/blocks/fluids/gas.png*'
        include 'assets/nuclearcraft/textures/blocks/fluids/heavy_water_*.png*'
        include 'assets/nuclearcraft/textures/blocks/fission/casing/wall.png'
        include 'assets/nuclearcraft/textures/blocks/fission/solid/controller_*.png'
        include 'assets/nuclearcraft/textures/blocks/fission/solid/cell.png'
        include 'assets/nuclearcraft/textures/blocks/fission/solid/sink/water.png'
        include 'assets/nuclearcraft/textures/blocks/fission/heavy_water_moderator.png'
        include 'assets/nuclearcraft/textures/blocks/fission/reflector/beryllium_carbon.png'
        include 'assets/nuclearcraft/textures/blocks/fission/vent_*.png'
        include 'assets/nuclearcraft/textures/blocks/fission/port/cell_*.png'
        include 'assets/nuclearcraft/textures/blocks/fission/port/side.png'
        include 'assets/nuclearcraft/textures/blocks/fission/port/top.png'
        include 'assets/nuclearcraft/textures/items/fuel_*/*.png'
        include 'assets/nuclearcraft/textures/items/depleted_fuel_*/*.png'
        include 'assets/nuclearcraft/textures/items/uranium/*.png'
        include 'assets/nuclearcraft/textures/items/neptunium/*.png'
        include 'assets/nuclearcraft/textures/items/plutonium/*.png'
        include 'assets/nuclearcraft/textures/items/americium/*.png'
        include 'assets/nuclearcraft/textures/items/curium/*.png'
        include 'assets/nuclearcraft/textures/items/berkelium/*.png'
        include 'assets/nuclearcraft/textures/items/californium/*.png'
        include 'assets/nuclearcraft/textures/items/boron/*.png'
        include 'assets/nuclearcraft/textures/items/lithium/*.png'
        include 'assets/nuclearcraft/textures/gui/container/solid_fission_controller.png'
        include 'assets/nuclearcraft/textures/blocks/turbine/**/*.png'
        exclude 'assets/nuclearcraft/textures/blocks/turbine/**/*_ctm.png'
        include 'assets/nuclearcraft/textures/gui/container/turbine_controller.png'
        include 'assets/nuclearcraft/textures/gui/container/melter.png'
        include 'assets/nuclearcraft/textures/gui/container/manufactory.png'
        include 'assets/nuclearcraft/textures/gui/container/alloy_furnace.png'
        include 'assets/nuclearcraft/textures/gui/container/separator.png'
        include 'assets/nuclearcraft/textures/gui/container/infuser.png'
        include 'assets/nuclearcraft/textures/blocks/ore/*.png'
        include 'assets/nuclearcraft/textures/blocks/ingot_block/*.png'
        include 'assets/nuclearcraft/textures/items/ingot/*.png'
        include 'assets/nuclearcraft/textures/items/dust/*.png'
        include 'assets/nuclearcraft/textures/items/alloy/*.png'
        include 'assets/nuclearcraft/textures/items/gem/*.png'
        include 'assets/nuclearcraft/textures/items/gem_dust/*.png'
        include 'assets/nuclearcraft/textures/items/compound/*.png'
        include 'assets/nuclearcraft/textures/items/part/*.png'
        eachFile {
            path = path.replace('/textures/blocks/', '/textures/block/').replace('/textures/items/', '/textures/item/')
        }
        includeEmptyDirs = false
    }
}

// The developer has accepted the EULA for these disposable local test directories.
tasks.matching { it.name in ['runServer', 'runGameTestServer'] }.configureEach {
    doFirst {
        def runDirectory = layout.buildDirectory.dir("runs/${name.substring(3).uncapitalize()}").get().asFile
        runDirectory.mkdirs()
        new File(runDirectory, 'eula.txt').text = 'eula=true\n'
    }
}

tasks.named('jar', Jar) {
    from 'LICENSE.md'
    finalizedBy 'reobfJar'
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}
