import groovy.json.JsonOutput
import groovy.json.JsonSlurper

plugins {
    id 'net.minecraftforge.gradle' version '6.0.54'
}

group = 'nc'
version = "${minecraft_version}-${mod_version}"
base.archivesName = 'nuclearcraft'

java.toolchain.languageVersion = JavaLanguageVersion.of(17)

sourceSets {
    // Keep the original sources available as a behavioral reference during the port.
    main {
        java.setSrcDirs(['src/forge/java'])
        resources.setSrcDirs(['src/forge/resources'])
    }
    gameTest {
        compileClasspath += main.output
        runtimeClasspath += main.output
    }
}

configurations {
    gameTestImplementation.extendsFrom implementation
}

minecraft {
    mappings channel: 'official', version: minecraft_version
    accessTransformer = file('src/forge/resources/META-INF/accesstransformer.cfg')

    runs {
        configureEach {
            workingDirectory layout.buildDirectory.dir("runs/${name}").get().asFile
            mods {
                nuclearcraft {
                    source sourceSets.main
                }
            }
        }

        client {}

        server {
            args '--nogui'
            property 'java.awt.headless', 'true'
        }

        gameTestServer {
            property 'forge.enabledGameTestNamespaces', 'nuclearcraft'
            property 'java.awt.headless', 'true'
            mods {
                nuclearcraft {
                    source sourceSets.gameTest
                }
            }
        }
    }
}

repositories {
    maven {
        url = 'https://maven.minecraftforge.net/'
        content { includeGroup 'com.github.glitchfiend' }
    }
    maven {
        url = 'https://modmaven.dev'
        content {
            includeGroup 'mezz.jei'
            includeGroup 'mekanism'
        }
    }
    maven {
        url = 'https://maven.theillusivec4.top/'
        content { includeGroup 'top.theillusivec4.curios' }
    }
    maven {
        url = 'https://maven.blamejared.com/'
        content { includeGroup 'vazkii.patchouli' }
    }
    maven {
        url = 'https://maven.squiddev.cc'
        content { includeGroup 'cc.tweaked' }
    }
    maven {
        url = 'https://www.cursemaven.com'
        content {
            includeModule 'curse.maven', 'embers-rekindled-300777'
            includeModule 'curse.maven', 'tinkers-construct-74072'
            includeModule 'curse.maven', 'mantle-74924'
            includeModule 'curse.maven', 'projecte-226410'
        }
    }
}

dependencies {
    minecraft "net.minecraftforge:forge:${minecraft_version}-${forge_version}"
    compileOnly "cc.tweaked:cc-tweaked-${minecraft_version}-forge-api:${cc_tweaked_version}"
    compileOnly "cc.tweaked:cc-tweaked-${minecraft_version}-common-api:${cc_tweaked_version}"
    compileOnly "cc.tweaked:cc-tweaked-${minecraft_version}-core-api:${cc_tweaked_version}"
    compileOnly fg.deobf("mezz.jei:jei-${minecraft_version}-common-api:${jei_version}")
    compileOnly fg.deobf("mezz.jei:jei-${minecraft_version}-forge-api:${jei_version}")
    compileOnly fg.deobf("top.theillusivec4.curios:curios-forge:${curios_version}:api")
    compileOnly fg.deobf("vazkii.patchouli:Patchouli:${patchouli_version}:api")
    compileOnly "mekanism:Mekanism:${mekanism_version}:api"
    compileOnly fg.deobf("com.github.glitchfiend:TerraBlender-forge:${minecraft_version}-${terrablender_version}")
    compileOnly fg.deobf('curse.maven:embers-rekindled-300777:7446478')
    compileOnly fg.deobf('curse.maven:tinkers-construct-74072:7449219')
    compileOnly fg.deobf('curse.maven:mantle-74924:7414488')
    compileOnly fg.deobf('curse.maven:projecte-226410:4901949')
}

def equipmentFamilies = ['boron', 'tough', 'hard_carbon', 'boron_nitride']
def equipmentItems = equipmentFamilies.collectMany { family ->
    ['sword', 'pickaxe', 'shovel', 'axe', 'hoe', 'spaxelhoe', 'helm', 'chest', 'legs', 'boots']
            .collect { kind -> "${kind}_${family}" }
}
def equipmentTextures = equipmentItems.collect { "assets/nuclearcraft/textures/items/${it}.png".toString() } +
        equipmentFamilies.collect { "assets/nuclearcraft/textures/models/armor/${it}_layer_*.png".toString() }

def processorRecipeFolders = ['manufactory', 'separator', 'decay_hastener', 'fuel_reprocessor', 'alloy_furnace',
        'infuser', 'melter', 'supercooler', 'electrolyzer', 'assembler', 'ingot_former', 'pressurizer',
        'chemical_reactor', 'salt_mixer', 'crystallizer', 'enricher', 'extractor', 'centrifuge', 'rock_crusher']

def markProcessorDefault
markProcessorDefault = { Map recipe, String marker ->
    if (recipe.type == 'forge:conditional') {
        recipe.recipes.each { markProcessorDefault(it.recipe, marker) }
    } else {
        recipe.nuclearcraft_default = marker
    }
}

tasks.named('processResources', ProcessResources) {
    inputs.property 'mod_version', mod_version
    inputs.property 'processorRecipeFolders', processorRecipeFolders
    inputs.file(buildFile).withPropertyName('resourceBuildRules')
    filesMatching('META-INF/mods.toml') {
        expand mod_version: mod_version
    }
    filesMatching(processorRecipeFolders.collect { "data/nuclearcraft/recipes/${it}/**/*.json".toString() }) { details ->
        String machine = details.path.split('/')[3]
        boolean ore = machine == 'manufactory' && (details.name.endsWith('_from_ore.json') || details.name.endsWith('_from_raw.json'))
        Map recipe = new JsonSlurper().parse(details.file)
        markProcessorDefault(recipe, ore ? machine + '/ore' : machine)
        String content = JsonOutput.toJson(recipe)
        boolean written = false
        details.filter { String ignored ->
            if (written) {
                return null
            }
            written = true
            return content
        }
    }
    from('src/main/resources') {
        include 'logo.png'
        include 'assets/nuclearcraft/textures/blocks/processor_*.png'
        include 'assets/nuclearcraft/textures/blocks/melter_front_*.png'
